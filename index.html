<!DOCTYPE html>

<head>

  <meta name="theme-color" content="#0B4F3C" />

  <meta property="og:description" content="বুদ্ধিবৃত্তিক ও গবেষণাধর্মী মিডিয়া প্ল্যাটফর্ম।" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230B4F3C'/%3E%3Cg fill='none' stroke='%23C9A227' stroke-width='1.5'%3E%3Crect x='20' y='20' width='24' height='24'/%3E%3Crect x='20' y='20' width='24' height='24' transform='rotate(45 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='2' fill='%23C9A227'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="./styles.css" />

<body class="min-h-dvh overflow-x-hidden bg-emerald font-bengali text-ivory">
  <!-- Background atmosphere -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_75%_55%_at_50%_-10%,rgba(201,162,39,0.17),transparent_62%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_60%_50%_at_50%_55%,rgba(14,102,79,0.55),transparent_70%)]"></div>
    <div class="pattern-layer absolute inset-0 opacity-[0.055]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_32%,rgba(3,24,17,0.62)_100%)]"></div>
    <div class="grain-layer absolute inset-0 opacity-[0.035] mix-blend-overlay"></div>
  </div>

  <!-- Hairline frame -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-3 z-40 border border-gold/15 sm:inset-6">
    <span class="absolute -left-[3px] -top-[3px] h-1.5 w-1.5 rotate-45 bg-gold/70"></span>
    <span class="absolute -right-[3px] -top-[3px] h-1.5 w-1.5 rotate-45 bg-gold/70"></span>
    <span class="absolute -bottom-[3px] -left-[3px] h-1.5 w-1.5 rotate-45 bg-gold/70"></span>
    <span class="absolute -bottom-[3px] -right-[3px] h-1.5 w-1.5 rotate-45 bg-gold/70"></span>
  </div>

  <div class="relative z-10 flex min-h-dvh flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between px-7 pt-8 sm:px-12 sm:pt-10">
      <div class="reveal flex items-center gap-3" style="animation-delay: 80ms">
        <svg class="h-3.5 w-3.5 text-gold/80" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect x="9.5" y="9.5" width="21" height="21" stroke="currentColor" stroke-width="1.4" />
          <rect x="9.5" y="9.5" width="21" height="21" stroke="currentColor" stroke-width="1.4" transform="rotate(45 20 20)" />
          <circle cx="20" cy="20" r="1.7" fill="currentColor" />
        </svg>
        <span lang="en" class="text-[0.62rem] font-medium uppercase tracking-[0.42em] text-gold-light/80">Wafa</span>
      </div>
      <span lang="en" class="reveal text-[0.6rem] uppercase tracking-[0.4em] text-ivory/55" style="animation-delay: 160ms">Est. 2026</span>
    </header>

    <!-- Hero -->
    <main class="relative isolate flex flex-1 flex-col items-center justify-center px-6 py-16 sm:py-20">
      <!-- Medallion backdrop -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-0 z-0 flex items-center justify-center overflow-hidden">
        <div class="absolute h-[min(84vw,600px)] w-[min(84vw,600px)] rounded-full border border-gold/[0.10]"></div>
        <div class="absolute h-[min(70vw,500px)] w-[min(70vw,500px)] rounded-full border border-gold/[0.06]"></div>
        <svg class="spin-slow absolute h-[min(66vw,470px)] w-[min(66vw,470px)] text-gold/[0.07]" viewBox="0 0 40 40" fill="none">
          <rect x="9.5" y="9.5" width="21" height="21" stroke="currentColor" stroke-width="0.35" />
          <rect x="9.5" y="9.5" width="21" height="21" stroke="currentColor" stroke-width="0.35" transform="rotate(45 20 20)" />
          <circle cx="20" cy="20" r="10.4" stroke="currentColor" stroke-width="0.3" />
        </svg>
        <div class="breathe absolute h-[min(58vw,400px)] w-[min(58vw,400px)] rounded-full bg-gold/[0.09] blur-[80px]"></div>
      </div>

      <div class="relative z-10 flex flex-col items-center text-center">
        <!-- Ornament -->
        <svg class="reveal h-8 w-8 text-gold/90" viewBox="0 0 40 40" fill="none" aria-hidden="true" style="animation-delay: 220ms">
          <rect x="9.5" y="9.5" width="21" height="21" stroke="currentColor" stroke-width="0.9" />
          <rect x="9.5" y="9.5" width="21" height="21" stroke="currentColor" stroke-width="0.9" transform="rotate(45 20 20)" />
          <circle cx="20" cy="20" r="1.8" fill="currentColor" />
        </svg>

        <h1 class="mt-7 flex flex-col items-center">
          <span lang="ar" dir="rtl" class="wordmark reveal block font-amiri text-[clamp(6rem,20vw,14rem)] font-normal leading-[1.12] text-ivory" style="animation-delay: 320ms">وفاء</span>
          <span lang="en" class="reveal mt-1 block text-[0.72rem] font-medium uppercase tracking-[0.62em] text-gold-light [margin-right:-0.62em] sm:mt-2 sm:text-sm" style="animation-delay: 460ms">WAFA</span>
        </h1>

        <!-- Divider -->
        <div class="reveal mt-7 flex items-center justify-center gap-3 sm:mt-8" aria-hidden="true" style="animation-delay: 560ms">
          <span class="h-px w-14 bg-gradient-to-r from-transparent to-gold/60 sm:w-20"></span>
          <span class="h-1.5 w-1.5 rotate-45 border border-gold/80"></span>
          <span class="h-px w-14 bg-gradient-to-l from-transparent to-gold/60 sm:w-20"></span>
        </div>

        <p class="reveal mt-7 max-w-md text-balance text-base font-normal leading-[1.9] text-ivory/90 sm:mt-8 sm:max-w-xl sm:text-xl" style="animation-delay: 660ms">
          বুদ্ধিবৃত্তিক ও গবেষণাধর্মী মিডিয়া প্ল্যাটফর্ম
        </p>

        <!-- Under construction badge -->
        <div class="reveal mt-9 sm:mt-11" style="animation-delay: 780ms">
          <div class="inline-flex max-w-[88vw] items-center gap-2.5 rounded-full border border-gold/30 bg-gold/[0.07] px-4 py-2.5 backdrop-blur-sm sm:gap-3 sm:px-6 sm:py-3">
            <span class="relative flex h-1.5 w-1.5 shrink-0 sm:h-2 sm:w-2" aria-hidden="true">
              <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-gold opacity-60"></span>
              <span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-gold sm:h-2 sm:w-2"></span>
            </span>
            <span class="text-center text-[0.76rem] font-normal leading-snug text-gold-light sm:text-sm">
              ওয়েবসাইটটি বর্তমানে নির্মাণাধীন রয়েছে
            </span>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 px-6 pb-10 text-center sm:pb-12">
      <div aria-hidden="true" class="mx-auto mb-6 h-px w-24 bg-gradient-to-r from-transparent via-gold/45 to-transparent sm:mb-7"></div>

      <p class="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-[0.8rem] font-medium leading-relaxed text-ivory/80 sm:gap-x-6 sm:text-base">
        <span>বিশ্বস্ততা</span>
        <span aria-hidden="true" class="inline-block h-1 w-1 rotate-45 bg-gold/70"></span>
        <span>দায়বদ্ধতা</span>
        <span aria-hidden="true" class="inline-block h-1 w-1 rotate-45 bg-gold/70"></span>
        <span>মূল্যবোধ</span>
      </p>

      <p class="mt-5 text-[0.62rem] leading-relaxed text-ivory/55 sm:mt-6">
        © ২০২৬ ওয়াফা — সর্বস্বত্ব সংরক্ষিত
      </p>
    </footer>
  </div>
</body>
</html>
